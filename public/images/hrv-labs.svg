<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </linearGradient>
    
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a476ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#c4a1ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a476ff" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a476ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a476ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Center Ambient Glow -->
  <circle cx="400" cy="250" r="220" fill="url(#centerGlow)" />

  <!-- Abstract Wave / Heartbeat ECG Path -->
  <path d="M 50 250 L 180 250 L 210 230 L 240 270 L 270 240 L 300 250 L 330 250 L 350 200 L 370 320 L 395 140 L 420 360 L 440 230 L 460 260 L 480 250 L 520 250 L 550 230 L 580 265 L 610 250 L 750 250" 
        fill="none" 
        stroke="url(#purpleGlow)" 
        stroke-width="3.5" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Neural Net Nodes & Pulses -->
  <g fill="#a476ff">
    <circle cx="350" cy="200" r="5" opacity="0.9"/>
    <circle cx="370" cy="320" r="5" opacity="0.9"/>
    <circle cx="395" cy="140" r="7" filter="url(#glow)" fill="#ffffff"/>
    <circle cx="420" cy="360" r="6" opacity="0.9"/>
    <circle cx="440" cy="230" r="5" opacity="0.9"/>
  </g>

  <!-- Title & Badge overlay -->
  <rect x="50" y="45" width="165" height="30" rx="15" fill="#a476ff" fill-opacity="0.15" stroke="#a476ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="70" y="65" fill="#c4a1ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SKRIPSI / RESEARCH</text>

  <text x="50" y="430" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">HRV-Labs</text>
  <text x="50" y="455" fill="#a5a5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Cognitive Load Classification using CNN-LSTM &amp; Sensor Signals</text>
</svg>

